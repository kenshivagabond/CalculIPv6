<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>exercices</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

	const user = JSON.parse(sessionStorage.getItem('user'));
        function Navbar() {
            return (
                <nav className="navbar">
                    <ul className="nav-links">
                        <li><a href="/exercices">Exercices</a></li>
			{ user ? (
                        <li><a href="/profile">Profil</a></li> ) : (
			<li><a href="/login">Se connecter</a></li>)}
                    </ul>
                </nav>
            );
        }

	function Exercices() {
    const [exercices, setExercices] = React.useState([]); // de ce que j'ai compris de ce truc il est question de mettre la page en continue à jour setExercices modifie en continue (et il faut l'utiliser pour toute modif)
    const gotoexo = (index) => {window.location.href = `/exercices/${index}`}

    React.useEffect(() => {
        fetch("http://localhost:3000/api/getExercices")
            .then((response) => response.json())
            .then((data) => { setExercices(data); }) // utilisation de setExercices ici
            .catch((error) => console.log(error));
    }, []);

    return (
        <div>
            <Navbar />
            <main className="container">
                <h1>Exercices :</h1>
                <ul>
                    {exercices.map((item, index) => (
                        <li key={index}>
                            <h2>{item.title}</h2>
                            <br />
                            <span>{item.description}</span>
                            <button onClick={() => gotoexo(index)}>Accéder</button>
                        </li>
                    	))}
                	</ul>
           	 </main>
        	</div>
     	);
     }

     const root = ReactDOM.createRoot(document.getElementById('root'));
     root.render(<Exercices />);

    </script>
</body>

</html>
