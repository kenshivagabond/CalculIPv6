<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>exercices</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // Composant Navigation Bar
        function Navbar() {
            return (
                <nav className="navbar">
                    <ul className="nav-links">
                        <li><a href="/exercices">Exercices</a></li>
                        <li><a href="/profile">Profil</a></li>
                    </ul>
                </nav>
            );
        }


        function Exercices() {
	    const gotoexo = (index) => {window.location.href = `/exercices/${index}`}
	    const exercices = await fetch("http://localhost:3000/api/getExercices");
            return (
       	    <div>
	      <Navbar />
	      <main className="container">
	      <h1>Exercices :</h1>
	      <ul>
		{exercices.map((exercices, index) => <li key={index}>{exerices.name}</li>)
		<button onClick={exerices(index)>Accéder</button>}}
	      </ul>
	      </main>
	      </div>
	      )
	}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Exercices />);
    </script>
</body>

</html>
