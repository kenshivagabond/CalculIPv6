<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Gestion des Utilisateurs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2, h3 {
            color: #333;
            margin-top: 0;
        }
        .grid-forms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        form, .panel {
            background: #fff;
            padding: 18px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[readonly] {
            background-color: #f1f3f5;
            color: #555;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .btn-sm {
            width: auto;
            margin-top: 0;
            padding: 6px 10px;
            font-size: 13px;
            margin-right: 6px;
        }
        .btn-edit {
            background-color: #007bff;
        }
        .btn-edit:hover {
            background-color: #0069d9;
        }
        .btn-progress {
            background-color: #6f42c1;
        }
        .btn-progress:hover {
            background-color: #5a32a3;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .status-banner {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .hidden {
            display: none;
        }
        .progress-box {
            margin-top: 25px;
        }
        pre {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
            overflow-x: auto;
        }
        .progress-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }
        .progress-list li {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .badge-ok {
            color: #155724;
            font-weight: bold;
        }
        .badge-ko {
            color: #721c24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Panneau d'Administration</h1>

    <div id="status-banner" class="status-banner"></div>

    <div class="grid-forms">
        <!-- Formulaire de création -->
        <form id="register-form">
            <h2>Créer un nouvel utilisateur</h2>

            <label for="username">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Adresse Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>

            <label for="role">Rôle :</label>
            <select id="role" name="role">
                <option value="user">Utilisateur</option>
                <option value="admin">Administrateur</option>
            </select>

            <button type="submit">Créer l'utilisateur</button>
        </form>

        <!-- Formulaire de mise à jour (affiché au clic sur "Modifier") -->
        <form id="update-form" class="hidden">
            <h2>Modifier l'utilisateur</h2>

            <label for="edit-username">Nom d'utilisateur :</label>
            <input type="text" id="edit-username" name="username" readonly required>

            <label for="edit-email">Adresse Email :</label>
            <input type="email" id="edit-email" name="email" required>

            <label for="edit-password">Nouveau mot de passe (optionnel) :</label>
            <input type="password" id="edit-password" name="password" placeholder="Laisser vide pour ne pas changer">

            <label for="edit-role">Rôle :</label>
            <select id="edit-role" name="role">
                <option value="user">Utilisateur</option>
                <option value="admin">Administrateur</option>
            </select>

            <button type="submit" class="btn-edit">Enregistrer les modifications</button>
            <button type="button" id="cancel-edit-btn" class="btn-secondary">Annuler</button>
        </form>
    </div>

    <h2>Liste des utilisateurs</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom d'utilisateur</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="users-table-body">
            <!-- Les utilisateurs seront insérés ici dynamiquement -->
        </tbody>
    </table>

    <!-- Encart de progression d'un utilisateur -->
    <div id="progress-panel" class="panel progress-box hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="progress-title">Progression de l'utilisateur</h3>
            <button type="button" id="close-progress-btn" class="btn-sm btn-secondary">Fermer</button>
        </div>
        <div id="progress-content"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/admin';
        let usersCache = [];

        // Optionnel : associer un id_exercice à un intitulé lisible
        const EXERCICE_LABELS = {
            7: 'QCM Type / Range IPv6'
        };

        function showStatus(message, isError = false) {
            const banner = document.getElementById('status-banner');
            banner.textContent = message;
            banner.className = `status-banner ${isError ? 'status-error' : 'status-success'}`;
            banner.style.display = 'block';
        }

        function formatExerciceName(item) {
            if (item.titre || item.title || item.nom) {
                return item.titre || item.title || item.nom;
            }
            const exId = item.id_exercice ?? item.exercices_id ?? item.exercise_id;
            if (exId !== undefined && exId !== null) {
                return EXERCICE_LABELS[exId]
                    ? `${EXERCICE_LABELS[exId]} (#${exId})`
                    : `Exercice #${exId}`;
            }
            return 'Exercice inconnu';
        }

        function formatStatus(item) {
            if (item.is_correct !== undefined && item.is_correct !== null) {
                return Boolean(item.is_correct)
                    ? '<span class="badge-ok">Réussi</span>'
                    : '<span class="badge-ko">Échoué</span>';
            }
            if (item.completed !== undefined) {
                return item.completed
                    ? '<span class="badge-ok">Complété</span>'
                    : '<span>En cours</span>';
            }
            return `<span>${item.status || 'Enregistré'}</span>`;
        }

        function formatDate(rawDate) {
            if (!rawDate) return '';
            const parsed = new Date(rawDate);
            return Number.isNaN(parsed.getTime()) ? String(rawDate) : parsed.toLocaleString('fr-FR');
        }

        // Charger la liste des utilisateurs
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`Erreur serveur (${response.status})`);
                }

                const users = await response.json();
                usersCache = Array.isArray(users) ? users : [];
                const tableBody = document.getElementById('users-table-body');
                tableBody.innerHTML = '';

                usersCache.forEach(user => {
                    const row = document.createElement('tr');
                    const safeUsername = encodeURIComponent(user.username);

                    row.innerHTML = `
                        <td>${user.id ?? user._id ?? ''}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <button type="button" class="btn-sm btn-edit" onclick="openEditForm('${safeUsername}')">Modifier</button>
                            <button type="button" class="btn-sm btn-progress" onclick="viewUserProgress('${safeUsername}')">Progression</button>
                            <button type="button" class="btn-sm btn-delete" onclick="deleteUser('${safeUsername}')">Supprimer</button>
                        </td>
                    `;

                    row.children[1].textContent = user.username;
                    row.children[2].textContent = user.email || 'N/A';
                    row.children[3].textContent = user.role;

                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Erreur lors de la récupération des utilisateurs :', error);
                showStatus('Erreur lors de la récupération des utilisateurs', true);
            }
        }

        // Ajouter un nouvel utilisateur
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password, role })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `Erreur serveur (${response.status})`);
                }

                showStatus(data.message || 'Utilisateur créé avec succès !');
                document.getElementById('register-form').reset();
                loadUsers();
            } catch (error) {
                console.error('Échec de la création de l\'utilisateur :', error);
                showStatus(error.message || 'Échec de la création de l\'utilisateur', true);
            }
        });

        // Pré-remplir et afficher le formulaire de mise à jour
        function openEditForm(encodedUsername) {
            const username = decodeURIComponent(encodedUsername);
            const user = usersCache.find(u => u.username === username);
            if (!user) return;

            document.getElementById('edit-username').value = user.username;
            document.getElementById('edit-email').value = user.email || '';
            document.getElementById('edit-password').value = '';
            document.getElementById('edit-role').value = user.role || 'user';

            const updateForm = document.getElementById('update-form');
            updateForm.classList.remove('hidden');
            updateForm.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('cancel-edit-btn').addEventListener('click', () => {
            document.getElementById('update-form').classList.add('hidden');
            document.getElementById('update-form').reset();
        });

        // Soumettre la mise à jour d'un utilisateur
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('edit-username').value.trim();
            const email = document.getElementById('edit-email').value.trim();
            const passwordInput = document.getElementById('edit-password').value;
            const role = document.getElementById('edit-role').value;

            const payload = { username, email, role };
            if (passwordInput.trim() !== '') {
                payload.password = passwordInput;
            }

            try {
                const response = await fetch(`${API_URL}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `Erreur serveur (${response.status})`);
                }

                showStatus(data.message || 'Utilisateur mis à jour avec succès !');
                document.getElementById('update-form').classList.add('hidden');
                document.getElementById('update-form').reset();
                loadUsers();
            } catch (error) {
                console.error('Erreur lors de la mise à jour :', error);
                showStatus(error.message || 'Erreur lors de la mise à jour', true);
            }
        });

        // Supprimer un utilisateur
        async function deleteUser(encodedUsername) {
            const username = decodeURIComponent(encodedUsername);
            if (!confirm(`Voulez-vous vraiment supprimer l'utilisateur "${username}" ?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/user?username=${encodeURIComponent(username)}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `Erreur serveur (${response.status})`);
                }

                showStatus(data.message || 'Utilisateur supprimé');
                loadUsers();
            } catch (error) {
                console.error('Erreur lors de la suppression :', error);
                showStatus(error.message || 'Erreur lors de la suppression', true);
            }
        }

        // Voir la progression d'un utilisateur sur les exercices
        async function viewUserProgress(encodedUsername) {
            const username = decodeURIComponent(encodedUsername);
            const panel = document.getElementById('progress-panel');
            const title = document.getElementById('progress-title');
            const content = document.getElementById('progress-content');

            title.textContent = `Progression de ${username}`;
            content.innerHTML = '<p>Chargement...</p>';
            panel.classList.remove('hidden');

            try {
                const response = await fetch(`${API_URL}/progress?username=${encodeURIComponent(username)}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `Erreur serveur (${response.status})`);
                }

                const items = Array.isArray(data) ? data : (data.progress || []);

                if (Array.isArray(items) && items.length === 0) {
                    content.innerHTML = '<p>Aucun exercice effectué pour le moment.</p>';
                } else if (Array.isArray(items) && items.length > 0) {
                    const ul = document.createElement('ul');
                    ul.className = 'progress-list';

                    items.forEach(item => {
                        const li = document.createElement('li');
                        const exName = formatExerciceName(item);
                        const statusHtml = formatStatus(item);
                        const dateStr = formatDate(item.did_at || item.created_at || item.date);

                        li.innerHTML = `
                            <span><strong>${exName}</strong> — ${statusHtml}</span>
                            <span>${dateStr}</span>
                        `;
                        ul.appendChild(li);
                    });

                    content.innerHTML = '';
                    content.appendChild(ul);
                } else {
                    content.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }

                panel.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Erreur lors de la récupération de la progression :', error);
                content.innerHTML = `<p style="color:#721c24;">${error.message || 'Erreur lors de la récupération de la progression'}</p>`;
            }
        }

        document.getElementById('close-progress-btn').addEventListener('click', () => {
            document.getElementById('progress-panel').classList.add('hidden');
        });

        // Charger la liste au premier chargement de la page
        loadUsers();
    </script>
</body>
</html>
